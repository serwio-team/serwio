
spring.application.name=serwio-backend

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# TEMP_DB=true: baza H2 w pamieci, bez Dockera. Dane znikaja po zamknieciu backendu.
# TEMP_DB=false: trwaly PostgreSQL z konfiguracji ponizej.
app.database.temporary=${TEMP_DB:false}
app.database.temporary-url=jdbc:h2:mem:serwio-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/serwio}
spring.datasource.username=${DB_USERNAME:serwio}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=CALLBACK

spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=${COMPOSE_FILE:compose.yaml}
spring.docker.compose.arguments[0]=--env-file
spring.docker.compose.arguments[1]=../.env
spring.docker.compose.lifecycle-management=start-only

# Jednorazowe dane do Postmana: wlasciciel z lokalizacja oraz firma z oddzialem i serwisantem.
# Kolejne uruchomienia wykorzystuja istniejace wpisy.
app.demo.seed.enabled=${SEED_DATA:false}
# Hasło ustawiane tylko przy tworzeniu konta lub aktywacji starego konta bez logowania.
# Bez SEED_PASSWORD generowane hasło zostanie wypisane w logach przy inicjalizacji konta.
app.demo.seed.password=${SEED_PASSWORD:}
